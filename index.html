<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charles To - Architecture Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            ::selection { background-color: black; color: white; }
        }
        
        /* Ensures smooth scrolling if content overflows */
        .scroll-touch {
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<!-- Changed to h-[100dvh] for better mobile browser support with address bars -->
<body class="h-[100dvh] bg-white text-black flex flex-col m-0 overflow-hidden">

    <!-- Header Section -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center p-6 border-b-2 border-black bg-white z-20 shrink-0">
        <div>
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tighter uppercase">
                Charles To
            </h1>
            <p class="text-xs md:text-sm font-medium tracking-[0.25em] uppercase mt-1 text-gray-500">
                Architecture Portfolio
            </p>
        </div>
        
        <div class="mt-6 md:mt-0 text-left md:text-right text-xs md:text-sm font-semibold uppercase tracking-widest flex flex-col space-y-2 w-full md:w-auto">
            <a href="mailto:charleswrtsy@gmail.com" class="hover:bg-black hover:text-white transition-colors duration-200 px-2 py-1 -mx-2 inline-block w-max md:w-auto md:ml-auto">
                charleswrtsy@gmail.com
            </a>
            <a href="tel:+85251616760" class="hover:bg-black hover:text-white transition-colors duration-200 px-2 py-1 -mx-2 inline-block w-max md:w-auto md:ml-auto">
                +852 51616760
            </a>
            
            <!-- Navigation Toggles -->
            <div class="mt-4 flex flex-row space-x-2 md:ml-auto w-full md:w-auto justify-start md:justify-end">
                <button id="nav-portfolio" onclick="switchPDF('portfolio.pdf', 'nav-portfolio', '#view=Fit&toolbar=0&navpanes=0')" class="bg-black text-white px-4 py-2 border border-black transition-colors duration-200 shadow-sm cursor-pointer flex-1 md:flex-none">
                    Main Portfolio
                </button>
                <button id="nav-thesis" onclick="switchPDF('thesis.pdf', 'nav-thesis', '#view=Fit&pageLayout=TwoColumnRight&toolbar=0&navpanes=0')" class="bg-white text-black hover:bg-gray-100 px-4 py-2 border border-black transition-colors duration-200 shadow-sm cursor-pointer flex-1 md:flex-none">
                    Thesis Project
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content - PDF Viewer Area -->
    <main class="flex-grow flex flex-col bg-[#525659] relative overflow-hidden">
        
        <!-- Mobile Warning & Direct Link (Visible only on small screens) -->
        <div class="md:hidden bg-white text-black text-xs p-3 z-30 shrink-0 border-b-2 border-black flex justify-between items-center">
            <span class="font-semibold uppercase tracking-widest text-gray-500">On mobile phone?</span>
            <a id="mobile-pdf-link" href="portfolio.pdf" target="_blank" rel="noopener noreferrer" class="bg-black text-white px-4 py-2 font-bold uppercase tracking-wider hover:bg-gray-800 transition-colors shadow-sm">
                Open PDF
            </a>
        </div>

        <!-- NEW: Sleek Loading Spinner (Sits behind the PDF) -->
        <div id="loading-indicator" class="absolute inset-0 flex flex-col items-center justify-center z-0">
            <div class="w-10 h-10 border-2 border-[#666] border-t-white rounded-full animate-spin"></div>
            <span class="text-white mt-4 text-xs font-semibold tracking-[0.2em] uppercase">Loading Document</span>
        </div>

        <div id="pdf-container" class="w-full flex-grow relative flex items-center justify-center scroll-touch overflow-y-auto z-10">
            
            <iframe 
                id="pdf-viewer"
                src="portfolio.pdf#view=Fit&toolbar=0&navpanes=0&page=1" 
                class="absolute top-0 left-0 w-full h-full border-none bg-[#525659] transition-opacity duration-500 opacity-0"
                title="Charles To - Architecture Portfolio"
                onload="this.classList.remove('opacity-0'); this.focus();"
            ></iframe>
            
            <!-- Previous Page Button -->
            <button onclick="changePage('prev')" title="Previous Page" class="absolute left-2 md:left-6 top-1/2 transform -translate-y-1/2 z-30 bg-white/90 hover:bg-black text-black hover:text-white p-1 shadow-sm border border-black transition-colors rounded-sm flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            
            <!-- Next Page Button -->
            <button onclick="changePage('next')" title="Next Page" class="absolute right-2 md:right-6 top-1/2 transform -translate-y-1/2 z-30 bg-white/90 hover:bg-black text-black hover:text-white p-1 shadow-sm border border-black transition-colors rounded-sm flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>

            <!-- Floating Fullscreen Button -->
            <a id="floating-fullscreen-link" href="portfolio.pdf" target="_blank" rel="noopener noreferrer" title="Read fullscreen in new tab" class="hidden md:flex absolute bottom-6 right-6 z-30 bg-black text-white p-3 shadow-lg hover:bg-gray-800 transition-transform hover:scale-105 items-center justify-center border border-black rounded-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                </svg>
            </a>
        </div>
    </main>

    <!-- Script to handle PDF switching and Loading Effects -->
    <script>
        // Track the current document state for the Next/Prev buttons
        let currentActivePdf = 'portfolio.pdf';
        let currentCustomParams = '#view=Fit&toolbar=0&navpanes=0';
        let currentPage = 1;

        function switchPDF(pdfFile, activeBtnId, customParams = '#view=Fit&toolbar=0&navpanes=0') {
            const iframe = document.getElementById('pdf-viewer');
            
            // Update tracking state
            currentActivePdf = pdfFile;
            currentCustomParams = customParams;
            currentPage = 1; // Reset to page 1 on new document
            
            // 1. Fade OUT the current PDF to reveal the loading spinner behind it
            iframe.classList.add('opacity-0');
            
            // 2. Wait a split second for the fade-out to finish, then swap the file
            setTimeout(() => {
                iframe.src = currentActivePdf + currentCustomParams + '&page=' + currentPage;
            }, 300); // 300ms delay matches our CSS transition-opacity duration
            
            // 3. Update the Mobile and Desktop Direct Links
            document.getElementById('mobile-pdf-link').href = pdfFile;
            document.getElementById('floating-fullscreen-link').href = pdfFile;

            // 4. Define the styling for active (black) and inactive (white) buttons
            const activeClass = "bg-black text-white px-4 py-2 border border-black transition-colors duration-200 shadow-sm cursor-pointer flex-1 md:flex-none";
            const inactiveClass = "bg-white text-black hover:bg-gray-100 px-4 py-2 border border-black transition-colors duration-200 shadow-sm cursor-pointer flex-1 md:flex-none";
            
            // 5. Reset both buttons to the inactive styling
            document.getElementById('nav-portfolio').className = inactiveClass;
            document.getElementById('nav-thesis').className = inactiveClass;
            
            // 6. Apply the active styling to the button that was just clicked
            document.getElementById(activeBtnId).className = activeClass;
        }

        // Custom function to handle Next/Previous buttons
        function changePage(direction) {
            if (direction === 'next') {
                currentPage++;
            } else if (direction === 'prev') {
                if (currentPage > 1) {
                    currentPage--;
                } else {
                    return; // Stop if already on page 1
                }
            }
            
            const iframe = document.getElementById('pdf-viewer');
            // Update the iframe URL to force the PDF to jump to the new page
            iframe.src = currentActivePdf + currentCustomParams + '&page=' + currentPage;
        }

        // Global Keyboard Listener for PDF Navigation
        window.addEventListener('keydown', function(e) {
            const iframe = document.getElementById('pdf-viewer');
            const navKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', ' '];
            
            if (iframe && navKeys.includes(e.key)) {
                if (document.activeElement !== iframe) {
                    iframe.focus();
                }
            }
        });
    </script>
</body>
</html>
