<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charles To - Architecture Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js for custom thesis viewer -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            ::selection { background-color: black; color: white; }
        }
        /* Book / flip styles for thesis viewer */
        .book-wrap{position:relative;display:flex;align-items:center;justify-content:center;height:100%;width:100%;perspective:2000px}
        .book{width:90%;max-width:1200px;height:90%;max-height:900px;position:relative;display:flex;align-items:center;justify-content:center}
        .spread{display:flex;gap:12px;align-items:stretch;justify-content:center;transition:transform 800ms cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
        .page{background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.25);overflow:hidden;display:flex;align-items:center;justify-content:center}
        .page canvas{width:100%;height:100%;display:block}
        .page.cover{flex:0 0 60%;}
        .page.normal{flex:0 0 48%;}
        .page.single{flex:0 0 60%;}
        .flip-anim{transform:rotateY(-180deg)}
        .thesis-nav{position:absolute;top:50%;left:12px;transform:translateY(-50%);z-index:40}
        .thesis-nav.right{left:auto;right:12px}
        .thesis-btn{background:rgba(255,255,255,0.9);border:1px solid #111;padding:8px 12px;cursor:pointer}
        /* Responsive: on small screens make pages stack and allow scrolling */
        @media (max-width: 768px){
            .book{width:100%;height:auto;max-height:none;padding:24px}
            .book-wrap{perspective:none;padding-top:12px;padding-bottom:48px}
            .spread{flex-direction:column;gap:18px;align-items:center;justify-content:flex-start;transform:none}
            .page.cover,.page.single{flex:0 0 auto;width:100%;max-width:820px}
            .page.normal{flex:0 0 auto;width:100%;max-width:820px}
            .page canvas{height:auto;width:100%}
            .thesis-nav{display:none}
        }
    </style>
</head>
<!-- Block right click and text highlighting to protect your work -->
<body class="min-h-screen bg-white text-black flex flex-col m-0 overflow-hidden select-none" oncontextmenu="return false;">

    <!-- Header Section -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center p-6 border-b-2 border-black bg-white z-10 shrink-0">
        <div>
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tighter uppercase">
                Charles To
            </h1>
            <p class="text-xs md:text-sm font-medium tracking-[0.25em] uppercase mt-1 text-gray-500">
                Architecture Portfolio
            </p>
        </div>
        
        <div class="mt-6 md:mt-0 text-left md:text-right text-xs md:text-sm font-semibold uppercase tracking-widest flex flex-col space-y-2">
            <a href="mailto:charleswrtsy@gmail.com" class="hover:bg-black hover:text-white transition-colors duration-200 px-2 py-1 -mx-2 inline-block w-max md:w-auto md:ml-auto">
                charleswrtsy@gmail.com
            </a>
            <a href="tel:+85251616760" class="hover:bg-black hover:text-white transition-colors duration-200 px-2 py-1 -mx-2 inline-block w-max md:w-auto md:ml-auto">
                +852 51616760
            </a>
            
            <!-- Navigation Toggles -->
            <div class="mt-4 flex flex-row space-x-2 md:ml-auto w-max md:w-auto">
                <button id="nav-portfolio" onclick="switchPDF('portfolio.pdf', 'nav-portfolio')" class="bg-black text-white px-4 py-2 border border-black transition-colors duration-200 shadow-sm cursor-pointer">
                    Main Portfolio
                </button>
                <button id="nav-thesis" onclick="switchPDF('thesis.pdf', 'nav-thesis')" class="bg-white text-black hover:bg-gray-100 px-4 py-2 border border-black transition-colors duration-200 shadow-sm cursor-pointer">
                    Thesis Project
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content - PDF Viewer Area -->
    <main class="flex-grow flex flex-col bg-[#525659] overflow-hidden">
        
        <div id="pdf-container" class="w-full flex-grow relative flex items-center justify-center overflow-hidden">
            <!-- Portfolio iframe (default) -->
            <div id="iframe-container" class="absolute top-0 left-0 w-full h-full z-20 bg-[#525659]">
                <iframe 
                    id="pdf-viewer"
                    src="portfolio.pdf#view=Fit&toolbar=0&navpanes=0&scrollbar=0" 
                    class="w-full h-full border-none"
                    title="Charles To - Architecture Portfolio"
                ></iframe>
            </div>

            <!-- Thesis custom book viewer (hidden until thesis loaded) -->
            <div id="thesis-book" class="absolute top-0 left-0 w-full h-full z-30 bg-[#525659] hidden">
                <div class="book-wrap">
                    <div class="book" id="book-root" aria-hidden="false">
                        <div class="spread" id="book-spread">
                            <!-- pages injected by script -->
                        </div>
                        <button class="thesis-nav thesis-btn" id="thesis-prev">◀</button>
                        <button class="thesis-nav right thesis-btn" id="thesis-next">▶</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Script to handle PDF switching and thesis viewer -->
    <script>
        // PDF.js worker setup
        const pdfjsLib = window['pdfjsLib'] || window['pdfjs-dist/build/pdf'];
        if (pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        }

        // State
        let portfolioBlobUrl = null;
        let thesisDoc = null;
        let thesisNumPages = 0;
        let currentSpreadStart = 1; // 1 = cover, then 2,4,6...

        // Prevent common save/print/download shortcuts globally
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'p' || e.key === 'S')) {
                e.preventDefault();
                e.stopPropagation();
            }
            // Ctrl+Shift+S
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 's') {
                e.preventDefault();
                e.stopPropagation();
            }
        }, {capture:true});

        // Disable context menu on critical viewer areas (body already blocks right click)
        document.getElementById('pdf-container').addEventListener('contextmenu', (e) => e.preventDefault());

        // Button style helpers
        const activeClass = "bg-black text-white px-4 py-2 border border-black transition-colors duration-200 shadow-sm cursor-pointer";
        const inactiveClass = "bg-white text-black hover:bg-gray-100 px-4 py-2 border border-black transition-colors duration-200 shadow-sm cursor-pointer";

        function switchPDF(pdfFile, activeBtnId) {
            // update button styling
            document.getElementById('nav-portfolio').className = inactiveClass;
            document.getElementById('nav-thesis').className = inactiveClass;
            document.getElementById(activeBtnId).className = activeClass;

            if (pdfFile.toLowerCase().includes('thesis')) {
                loadThesis(pdfFile);
            } else {
                loadPortfolio(pdfFile);
            }
        }

        // Load portfolio using iframe; keep its scrolling behavior unchanged
        async function loadPortfolio(pdfFile) {
            // show iframe, hide thesis
            document.getElementById('iframe-container').classList.remove('hidden');
            document.getElementById('thesis-book').classList.add('hidden');

            // Restore page-level scrolling to original (prevent body scrolling while iframe handles its own scroll)
            document.body.style.overflow = 'hidden';

            try {
                if (portfolioBlobUrl) {
                    URL.revokeObjectURL(portfolioBlobUrl);
                    portfolioBlobUrl = null;
                }
                const resp = await fetch(pdfFile);
                const blob = await resp.blob();
                portfolioBlobUrl = URL.createObjectURL(blob);
                const iframe = document.getElementById('pdf-viewer');
                iframe.src = portfolioBlobUrl + '#view=Fit&toolbar=0&navpanes=0&scrollbar=0';
            } catch (err) {
                console.error('Failed to load portfolio PDF', err);
            }
        }

        // Load thesis using PDF.js and render two-page facing spreads with a cover alone
        async function loadThesis(pdfFile) {
            // show thesis viewer, hide iframe
            document.getElementById('iframe-container').classList.add('hidden');
            document.getElementById('thesis-book').classList.remove('hidden');

            // clear previous
            thesisDoc = null;
            thesisNumPages = 0;
            currentSpreadStart = 1;

            try {
                const resp = await fetch(pdfFile);
                const arrayBuffer = await resp.arrayBuffer();
                const loadingTask = pdfjsLib.getDocument({data: arrayBuffer});
                thesisDoc = await loadingTask.promise;
                thesisNumPages = thesisDoc.numPages;
                // If on mobile, render single-column stacked pages for scrolling
                if (isMobile()) {
                    document.body.style.overflow = 'auto';
                    renderMobileDocument();
                } else {
                    document.body.style.overflow = 'hidden';
                    renderSpread(currentSpreadStart);
                }
            } catch (err) {
                console.error('Failed to load thesis PDF', err);
            }
        }

        function isMobile(){
            return window.matchMedia && window.matchMedia('(max-width: 768px)').matches;
        }

        // Render entire document as a single-column stack for mobile scrolling
        async function renderMobileDocument(){
            const spread = document.getElementById('book-spread');
            spread.classList.remove('flip-anim');
            spread.innerHTML = '';
            // render pages sequentially (cover first)
            for (let p = 1; p <= thesisNumPages; p++){
                const pageEl = document.createElement('div');
                pageEl.className = (p === 1) ? 'page cover single' : 'page normal';
                const canvas = document.createElement('canvas');
                pageEl.appendChild(canvas);
                spread.appendChild(pageEl);
                // render but don't await all at once to make first pages visible sooner
                // await each page to keep order
                try{ await renderPageToCanvas(p, canvas, {cover: p===1}); }catch(e){console.warn('render page failed',p,e)}
            }
            // ensure nav is hidden on mobile
            document.getElementById('thesis-prev').style.display = 'none';
            document.getElementById('thesis-next').style.display = 'none';
        }

        // Render a spread starting at page "start" (1 = cover)
        async function renderSpread(start) {
            const spread = document.getElementById('book-spread');
            // Simple flip animation: add class then swap content
            spread.classList.add('flip-anim');

            // wait briefly for animation 'turn'
            setTimeout(async () => {
                spread.innerHTML = '';

                if (start === 1) {
                    // cover alone
                    const pageNum = 1;
                    const pageEl = document.createElement('div');
                    pageEl.className = 'page cover single';
                    const canvas = document.createElement('canvas');
                    pageEl.appendChild(canvas);
                    spread.appendChild(pageEl);
                    await renderPageToCanvas(pageNum, canvas, {cover:true});
                } else {
                    // two-page facing: left = start, right = start+1
                    const leftNum = start;
                    const rightNum = start + 1;
                    const leftEl = document.createElement('div');
                    leftEl.className = 'page normal';
                    const leftCanvas = document.createElement('canvas');
                    leftEl.appendChild(leftCanvas);
                    spread.appendChild(leftEl);

                    const rightEl = document.createElement('div');
                    rightEl.className = 'page normal';
                    const rightCanvas = document.createElement('canvas');
                    rightEl.appendChild(rightCanvas);
                    spread.appendChild(rightEl);

                    await renderPageToCanvas(leftNum, leftCanvas, {cover:false});
                    if (rightNum <= thesisNumPages) {
                        await renderPageToCanvas(rightNum, rightCanvas, {cover:false});
                    } else {
                        // blank right page when odd number of pages
                        const ctx = rightCanvas.getContext('2d');
                        rightCanvas.width = leftCanvas.width;
                        rightCanvas.height = leftCanvas.height;
                        ctx.fillStyle = '#f7f7f7';
                        ctx.fillRect(0,0,rightCanvas.width,rightCanvas.height);
                    }
                }

                // ensure nav visibility and handlers
                setupThesisNav();

                // remove flip class after swap
                setTimeout(()=> spread.classList.remove('flip-anim'), 50);
            }, 250);
        }

        async function renderPageToCanvas(pageNum, canvas, opts={}) {
            if (!thesisDoc || pageNum < 1 || pageNum > thesisNumPages) return;
            const page = await thesisDoc.getPage(pageNum);
            const viewport = page.getViewport({scale:1});

            // Choose scale so that page height fits the book area
            const bookRoot = document.getElementById('book-root');
            const maxHeight = Math.min(bookRoot.clientHeight * 0.95, 1200);
            const scale = (maxHeight / viewport.height) * window.devicePixelRatio * 0.95;
            const scaledViewport = page.getViewport({scale});

            canvas.width = Math.floor(scaledViewport.width);
            canvas.height = Math.floor(scaledViewport.height);
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0,0,canvas.width,canvas.height);

            await page.render({canvasContext: ctx, viewport: scaledViewport}).promise;
        }

        function setupThesisNav(){
            const prev = document.getElementById('thesis-prev');
            const next = document.getElementById('thesis-next');
            prev.onclick = () => {
                if (currentSpreadStart === 1) return; // at cover
                if (currentSpreadStart === 2) {
                    currentSpreadStart = 1;
                } else {
                    currentSpreadStart = Math.max(2, currentSpreadStart - 2);
                }
                renderSpread(currentSpreadStart);
            };
            next.onclick = () => {
                if (currentSpreadStart === 1) {
                    currentSpreadStart = 2;
                } else {
                    currentSpreadStart = currentSpreadStart + 2;
                }
                if (currentSpreadStart > thesisNumPages) {
                    currentSpreadStart = Math.max(1, thesisNumPages - (thesisNumPages % 2 === 0 ? 1 : 0));
                }
                renderSpread(currentSpreadStart);
            };

            // also prevent context menu on thesis area
            document.getElementById('thesis-book').addEventListener('contextmenu', (e) => e.preventDefault());
        }

        // Initialize default state (portfolio shown)
        (function init(){
            // Ensure portfolio button active by default
            document.getElementById('nav-portfolio').className = activeClass;
            document.getElementById('nav-thesis').className = inactiveClass;
            // Leave initial iframe src as-is; keep scrolling behavior intact
        })();
    </script>
</body>
</html>
